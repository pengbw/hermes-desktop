<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hermes Desktop</title>
    <script>
      (function() {
        try {
          var bgMap = {
            'light': '#f5f5f7',
            'dark': '#0f0f1a',
            'light-macos': '#f5f5f7',
            'dark-macos': '#1e1e1e',
            'light-neumorphism': '#e8ecf1',
            'dark-glassmorphism': '#1a1035',
            'dark-cyberpunk': '#0a0a0f',
            'dark-aurora': '#0c1222',
            'light-ai-native': '#f8fafc',
            'dark-ai-native': '#0c0a1a'
          };
          var themeName = localStorage.getItem('hermes-theme-name') || 'light';
          var themeMode = localStorage.getItem('hermes-theme-mode') || 'system';
          var resolved = themeName;
          if (themeMode === 'system') {
            if (themeName === 'light' || themeName === 'dark') {
              resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            } else {
              resolved = themeName;
            }
          } else if (themeMode === 'light' || themeMode === 'dark') {
            if (themeName === 'light' || themeName === 'dark') {
              resolved = themeMode;
            } else {
              resolved = themeName;
            }
          }
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.backgroundColor = bgMap[resolved] || (resolved.startsWith('dark') ? '#0f0f1a' : '#f5f5f7');
        } catch(e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
