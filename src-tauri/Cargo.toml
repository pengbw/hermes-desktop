[package]
name = "hermes-desktop"
version = "0.4.0"
description = "Hermes Desktop - AI Assistant with Live2D Avatar"
authors = ["Peng Baowei"]
edition = "2021"

[lib]
name = "hermes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
urlencoding = "2.1.3"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls", "derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
futures-util = "0.3"
base64 = "0.22"
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
tokenizers = "0.21"
notify = { version = "7", features = ["macos_kqueue"] }
tauri-plugin-mic-recorder = "2.0.0"
mp3-duration = "0.1"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
serde_yaml = "0.9"

[target.'cfg(not(target_os = "windows"))'.dependencies]
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }
ndarray = "0.17"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Dwm", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
